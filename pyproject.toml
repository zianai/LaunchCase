[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "launchcase"
version = "0.1.0"
description = "Evidence-first product development workbench; offline by default"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "sqlalchemy==2.1.6",
  "alembic==1.20.1", "httpx==0.28.1", "uvicorn==0.54.0",
  "langgraph==1.2.18", "langgraph-checkpoint-sqlite==3.1.2",
  "openai-agents==0.24.0", "arq==0.28.0", "psycopg[binary,pool]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3", "build==1.4.0", "jsonschema==4.26.0"]

[project.scripts]
launchcase = "launchcase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchcase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
